# 被抓取的是宿主机上的 Spring Boot 应用（server.port=8081，见 application.yaml）。
# 只暴露了 health 与 prometheus 两个端点，无需鉴权（MvcConfig 白名单）。

global:
  # 15s 这个值和代码里的注释是绑定的：TransactionOutboxPublisher 的积压 gauge
  # 读的是"上一轮扫描"的内存快照（扫描间隔 1s），抓取再密也不会更准，
  # 只会把 http_server_requests 的直方图桶放大成一堆无用序列。
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

# 只定义规则、不接 Alertmanager：本地栈的告警出口是 Prometheus 自己的 /alerts
# 页面和面板上的阈值线。要真的推送，起一个 alertmanager 服务，再加上：
#   alerting:
#     alertmanagers:
#       - static_configs:
#           - targets: ["alertmanager:9093"]
# 这里刻意不写空的 alerting 段 —— 没跑过的可选段落少写一个，就少一个校验面。

scrape_configs:
  - job_name: dianping
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        # 不加 application 标签：management.metrics.tags.application 已经在
        # 每条序列上带了 hmdp，这里重复定义会让两个来源同名不同值。

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
