# 压测脚本自带的 JMeter 属性覆盖层，用 `jmeter -q jmeter.properties` 加载。
#
# 放在仓库里而不是改 JMeter 安装目录的 bin/jmeter.properties：
# 后者在仓库之外，别人 clone 下来就没有，压测结果会静默失真。

# 默认值是 2 —— 1000 个线程会共享到同一 host 的 2 条连接，全部排队建连，
# 测出来的是「建连开销」而非服务端能力。5.6.3 的 jmeter.properties 里
# 根本没列出这一项（默认值写死在代码里），所以必须显式覆盖。
httpclient4.max_per_route=1000

# 连接存活时间（ms），配合 HTTP 请求的 KeepAlive 复用连接，
# 规避 macOS somaxconn=128 导致的 SYN 重传退避。
httpclient4.time_to_live=60000
