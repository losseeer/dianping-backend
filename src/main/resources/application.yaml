server:
  port: 8081
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dingping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    # password 留空 — 本地 MySQL 无密码
  redis:
    host: 127.0.0.1
    port: 6379
    # 命令超时 —— 不配的默认值是 Lettuce 的 60 秒。
    # 【为什么要配】Redis 不可用时，请求会挂住等这个超时，而不是快速失败。
    # 实测：停掉 Redis 后 /user/code 挂 >20 秒无任何响应，fail-open 形同虚设 ——
    # 代码是对的，但降级速度以分钟计就等于没有降级。
    #
    # 【必须大于最长阻塞命令的阻塞时长】SeckillVoucherListener 用的是
    # XREADGROUP ... BLOCK 2 秒。命令超时必须留出余量，否则每一次阻塞读
    # 都会在阻塞结束前被掐断，报 RedisCommandTimeoutException —— 表现是
    # 秒杀订单全部写不进 DB、Redis 库存与 DB 长期不一致（压测 verify 会 FAIL）。
    # 这里取 3000ms：2 秒阻塞 + 1 秒余量。调小它之前先看这个约束。
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 30
        max-idle: 15
        min-idle: 5
        time-between-eviction-runs: 10s
        # 借连接的等待上限。默认是 -1 = 【无限等待】—— 不设它的话，池被占满时
        # 线程会一直阻塞在 borrowObject() 上，上面的 500ms 命令超时根本不是
        # 真实上界。而秒杀接口的设计前提就是"拒绝要毫秒级返回"。
        max-wait: 200ms
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
# Elasticsearch 配置
# 【八股：ES的9200端口 vs 9300端口】
# 9200：HTTP REST API端口，客户端用这个
# 9300：TCP传输端口，集群节点间通信用这个
# RestHighLevelClient底层用的就是9200端口的HTTP协议
elasticsearch:
  rest:
    uris: http://127.0.0.1:9200
  init:
    # 默认不删除已有索引；首次部署会创建，若发现旧索引 mapping 为空会自动补写。
    # 修改 synonyms.txt 或 analyzer 配置时，临时改为 true 重启一次，再改回 false。
    rebuild-on-startup: false
    shards: 1
    replicas: 0
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: info
management:
  endpoints:
    web:
      # 只暴露这两个：include=* 会把 env/beans/heapdump 一起开到 8081 上，
      # 其中 env 直接可读配置、heapdump 能把堆拖成一个几百 MB 的文件。
      exposure:
        include: health,prometheus
  metrics:
    tags:
      # 多实例部署后所有指标都带 application 维度，Prometheus 侧按实例聚合时必需
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 【为什么必须开直方图】Micrometer 自己算的 percentile 不会出现在
        # /actuator/prometheus 里；只有开了 histogram 才会导出
        # http_server_requests_seconds_bucket，Prometheus 侧才能用
        # histogram_quantile() 算服务端 P99——这是替代"Postman 手跑 200 次"
        # 的前提。代价是每个 bucket 一条时间序列：实测 Micrometer 默认导出 69 个
        # le 桶（0.001s ~ 30s 的几何递增 + +Inf），桶数固定不随基数增长，
        # 但会随 (uri, method, status, outcome, exception) 的组合数线性放大。
        http.server.requests: true
payment:
  # Public callbacks remain disabled until this environment variable is configured.
  callback-secret: ${PAYMENT_CALLBACK_SECRET:}
sms:
  # 验证码发送限流（Redis + Lua，见 SmsRateLimiter / sms-rate-limit.lua）
  # 【约束】cooldown-seconds 必须 < 验证码自身的 TTL（UserServiceImpl 里写死 2 分钟），
  #   否则用户收不到短信时，在验证码有效期内连一次重发的机会都没有。
  rate-limit:
    # 同一手机号的发送冷却
    cooldown-seconds: ${SMS_COOLDOWN_SECONDS:60}
    # 同一手机号的日上限（窗口为滚动 24h，从首次发送起算，不是自然日）
    daily-limit: ${SMS_DAILY_LIMIT:10}
    daily-window-seconds: ${SMS_DAILY_WINDOW_SECONDS:86400}
    # 全站兜底：挡"用大量不同手机号轰炸"（手机号枚举 / 短信泵送）。
    # 注意这是【预算输入】不是容量推导——上游瓶颈是短信服务商的配额和你的钱包，
    # 不是这台服务器的处理能力，所以定不了"压测测出来的最优值"。
    # 默认 60/分钟 是占位值，最坏情况约 8.6 万条/天 ≈ ¥3.4k/天（按 0.04 元/条），
    # 请按实际短信预算调整。
    global-limit: ${SMS_GLOBAL_LIMIT:60}
    global-window-seconds: ${SMS_GLOBAL_WINDOW_SECONDS:60}
