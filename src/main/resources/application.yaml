server:
  port: 8081
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dingping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    # password 留空 — 本地 MySQL 无密码
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        max-active: 30
        max-idle: 15
        min-idle: 5
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
# Elasticsearch 配置
# 【八股：ES的9200端口 vs 9300端口】
# 9200：HTTP REST API端口，客户端用这个
# 9300：TCP传输端口，集群节点间通信用这个
# RestHighLevelClient底层用的就是9200端口的HTTP协议
elasticsearch:
  rest:
    uris: http://127.0.0.1:9200
  init:
    # 【关键】启动时强制 DROP+重建 shop 索引（settings+mappings 包含 synonym_graph filter + IK 双 analyzer）
    # 目的：修复「ES 同义词 Graph Filter 从未写入 ES」的断口。
    # 使用建议：
    #   · 首次部署 / 修改 synonyms.txt / 修改 analyzer 配置 时设为 true，重启一次即可完成重建
    #   · 重建完成后可改回 false（避免每次重启都删数据重导），或调用 POST /shop/search/rebuild-index 管理接口
    rebuild-on-startup: true
    shards: 1
    replicas: 0
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
