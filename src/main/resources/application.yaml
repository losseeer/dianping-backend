server:
  port: 8081
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dingping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    # password 留空 — 本地 MySQL 无密码
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        max-active: 30
        max-idle: 15
        min-idle: 5
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
# Elasticsearch 配置
# 【八股：ES的9200端口 vs 9300端口】
# 9200：HTTP REST API端口，客户端用这个
# 9300：TCP传输端口，集群节点间通信用这个
# RestHighLevelClient底层用的就是9200端口的HTTP协议
elasticsearch:
  rest:
    uris: http://127.0.0.1:9200
  init:
    # 默认不删除已有索引；首次部署会创建，若发现旧索引 mapping 为空会自动补写。
    # 修改 synonyms.txt 或 analyzer 配置时，临时改为 true 重启一次，再改回 false。
    rebuild-on-startup: false
    shards: 1
    replicas: 0
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: info
payment:
  # Public callbacks remain disabled until this environment variable is configured.
  callback-secret: ${PAYMENT_CALLBACK_SECRET:}
